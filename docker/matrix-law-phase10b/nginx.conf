events {
    worker_connections 256;
}

pid /tmp/nginx.pid;

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream matrix_gateway {
        server gateway:8001 max_fails=1 fail_timeout=1s;
        server gateway-b:8001 max_fails=1 fail_timeout=1s;
        keepalive 16;
    }

    server {
        listen 8080;
        client_max_body_size 101m;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 600s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_pass http://matrix_gateway;
            add_header X-Matrix-Test-Upstream $upstream_addr always;
        }
    }
}
