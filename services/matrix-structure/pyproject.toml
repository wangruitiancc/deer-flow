[project]
name = "matrix-structure"
version = "0.1.0"
description = "Private PP-StructureV3 sidecar for MatrixFlow Law"
requires-python = ">=3.11,<3.13"
dependencies = [
  "paddleocr[doc-parser]==3.2.0",
  "paddlepaddle==3.2.2",
]

[project.scripts]
matrix-structure = "matrix_structure.server:main"
matrix-structure-assets = "matrix_structure.assets:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_structure"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
